<a cdkMonitorElementFocus [routerLink]="link()" [class.active]="active()" [attr.aria-current]="active() ? 'page' : null">
  <span class="pill">
    <mat-icon [fontSet]="active() ? 'material-icons' : 'material-icons-outlined'" aria-hidden="true">
      {{ icon() }}
    </mat-icon>
  </span>
  <span class="label">{{ label() }}</span>
</a>
