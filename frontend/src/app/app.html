<mat-toolbar color="primary" class="toolbar">
  <a class="brand" routerLink="/">ESN Gdańsk</a>

  <nav>
    <a mat-button routerLink="/events" routerLinkActive="active">Events</a>
    <a mat-button routerLink="/discounts" routerLinkActive="active">Discounts</a>
    <a mat-button routerLink="/info" routerLinkActive="active">Info</a>
  </nav>

  <span class="spacer"></span>

  @if (auth.isLoggedIn()) {
    <span class="user-email">{{ auth.email() }}</span>
    <button mat-button (click)="logout()">Log out</button>
  } @else {
    <a mat-button routerLink="/auth">Log in</a>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
