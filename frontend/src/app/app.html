<!-- Main application shell -->
<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/" aria-label="ESN Gdańsk home">
    <img src="/images/esnstar.png" alt="" />
    <span>ESN Gdańsk</span>
  </a>

  <nav class="desktop-menu" aria-label="Main navigation">
    @for (item of navItems; track item.link) {
      <app-nav-item
        layout="inline"
        [link]="item.link"
        [label]="item.label"
        [icon]="item.icon"
        [colour]="item.colour"
        [exact]="item.link === '/'"
        [alsoActive]="item.link === '/' && newsPage()"
      [alsoActive]="item.link === '/' && newsPage()"
      />
    }
  </nav>

  <div class="account">
    <app-theme-toggle class="theme-toggle--mobile" />
    <app-theme-toggle class="theme-toggle--desktop" variant="segmented" />
    @if (auth.isLoggedIn()) {
      <div class="text-actions">
        @if (auth.isAdmin()) {
          <a class="text-action" routerLink="/admin">Admin panel</a>
        }
        <button class="text-action" type="button" (click)="logout()">Log out</button>
      </div>
    } @else {
      <a class="pill-button" routerLink="/auth">Log in</a>
    }
  </div>
</mat-toolbar>

<main
  class="content"
  [class.public-page]="publicPage()"
  [class.mobile-navigation-hidden]="hideMobileNavigation()"
>
  <router-outlet />
</main>

<nav class="mobile-menu" [class.hidden]="hideMobileNavigation()" aria-label="Mobile navigation">
  @for (item of navItems; track item.link) {
    <app-nav-item
      [link]="item.link"
      [label]="item.label"
      [icon]="item.icon"
      [colour]="item.colour"
      [exact]="item.link === '/'"
      [alsoActive]="item.link === '/' && newsPage()"
    />
  }
</nav>
