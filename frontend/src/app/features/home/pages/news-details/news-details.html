<main class="details-page">
  <a class="back" routerLink="/" aria-label="Back to home">
    <span class="back-icon" aria-hidden="true"></span>
    <span class="back-label">Home</span>
  </a>

  @if (newsItem(); as loaded) {
    <app-news-details-view [newsItem]="detailsView(loaded)" />
  } @else if (newsItem() === null) {
    <section class="not-found">
      <h1>Story not found</h1>
      <p>This news item may no longer be available.</p>
      <a routerLink="/">Return to home</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
