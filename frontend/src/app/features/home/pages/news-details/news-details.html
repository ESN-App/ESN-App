<main class="details-page">
  @if (newsItem(); as loaded) {
    <app-news-details-view [newsItem]="detailsView(loaded)">
      <a detailBack class="back-button" routerLink="/" aria-label="Back to home">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-news-details-view>
  } @else if (newsItem() === null) {
    <section class="not-found card">
      <h1>Story not found</h1>
      <p>This news item may no longer be available.</p>
      <a class="pill-button" routerLink="/">Back to home</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
