<main class="details-page">
  @if (newsItem(); as loaded) {
    <app-news-details-view class="details-fade-in" [newsItem]="detailsView(loaded)">
      <a detailBack class="back-button" routerLink="/" aria-label="Back to home">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-news-details-view>
  } @else if (newsItem() === null) {
    <section class="not-found card">
      <h1>Story not found</h1>
      <p>This news item may no longer be available.</p>
      <a class="pill-button" routerLink="/">Back to home</a>
    </section>
  } @else {
    <div class="article-page">
      <div class="detail-hero">
        <a class="back-button" routerLink="/" aria-label="Back to home">
          <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </a>
      </div>
      <div class="article-head" role="status" aria-label="Loading">
        <span class="skeleton skeleton-title" style="width: 70%"></span>
      </div>
      <div class="article-body">
        <span class="skeleton article-image"></span>
        <span class="skeleton-text">
          <span class="skeleton" style="width: 100%"></span>
          <span class="skeleton" style="width: 95%"></span>
          <span class="skeleton" style="width: 70%"></span>
        </span>
      </div>
    </div>
  }
</main>
