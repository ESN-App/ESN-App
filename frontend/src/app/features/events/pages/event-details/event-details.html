<main class="details-page">
  <a class="back" routerLink="/events" queryParamsHandling="preserve" aria-label="Back to events">
    <span class="back-icon" aria-hidden="true"></span>
    <span class="back-label">Events</span>
  </a>

  @if (event(); as loaded) {
    <app-event-details-view [event]="loaded" />
  } @else if (event() === null) {
    <section class="not-found">
      <h1>Event not found</h1>
      <p>This event may no longer be available.</p>
      <a routerLink="/events">Return to events</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
