<main class="details-page">
  @if (event(); as loaded) {
    <app-event-details-view class="details-fade-in" [event]="loaded">
      <a
        detailBack
        class="back-button"
        routerLink="/events"
        queryParamsHandling="preserve"
        aria-label="Back to events"
      >
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-event-details-view>
  } @else if (event() === null) {
    <section class="not-found card">
      <h1>Event not found</h1>
      <p>This event may no longer be available.</p>
      <a class="pill-button" routerLink="/events">Back to events</a>
    </section>
  } @else {
    <div class="detail-hero detail-hero--events loading-hero">
      <a class="back-button" routerLink="/events" queryParamsHandling="preserve" aria-label="Back to events">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </div>
    <app-skeleton variant="event-detail" />
  }
</main>
