<main class="details-page">
  @if (article(); as loaded) {
    <app-info-details-view [article]="loaded">
      <a detailBack class="back-button" routerLink="/info" aria-label="Back to info">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-info-details-view>
  } @else if (article() === null) {
    <section class="not-found card">
      <h1>Guide not found</h1>
      <p>This guide may no longer be published.</p>
      <a class="pill-button" routerLink="/info">Back to info</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
