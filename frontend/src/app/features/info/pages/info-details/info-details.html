<main class="details-page">
  @if (article(); as loaded) {
    <app-info-details-view class="details-fade-in" [article]="loaded">
      <a detailBack class="back-button" routerLink="/info" aria-label="Back to info">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-info-details-view>
  } @else if (article() === null) {
    <section class="not-found card">
      <h1>Guide not found</h1>
      <p>This guide may no longer be published.</p>
      <a class="pill-button" routerLink="/info">Back to info</a>
    </section>
  } @else {
    <div class="article-page">
      <div class="detail-hero detail-hero--info">
        <a class="back-button" routerLink="/info" aria-label="Back to info">
          <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </a>
      </div>
      <div class="article-head" role="status" aria-label="Loading">
        <span class="skeleton skeleton-title" style="width: 70%"></span>
      </div>
      <div class="article-body">
        <span class="skeleton article-image"></span>
        <span class="skeleton-text">
          <span class="skeleton" style="width: 100%"></span>
          <span class="skeleton" style="width: 95%"></span>
          <span class="skeleton" style="width: 70%"></span>
        </span>
      </div>
    </div>
  }
</main>
