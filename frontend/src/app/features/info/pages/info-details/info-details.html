<main class="details-page">
  <a class="back" routerLink="/info" aria-label="Back to info">
    <span class="back-icon" aria-hidden="true"></span>
    <span class="back-label">Info</span>
  </a>

  @if (article(); as loaded) {
    <app-info-details-view [article]="loaded" />
  } @else if (article() === null) {
    <section class="not-found">
      <span aria-hidden="true">?</span>
      <h1>Information not found</h1>
      <p>This section may no longer be published.</p>
      <a routerLink="/info">Return to Info</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
