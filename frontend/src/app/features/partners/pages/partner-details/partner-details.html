<main class="details-page">
  @if (partner(); as loaded) {
    <app-partner-details-view class="details-fade-in" [partner]="detailsViewModel(loaded)">
      <a
        detailBack
        class="back-button" appBackLink
        routerLink="/partners"
        queryParamsHandling="preserve"
        aria-label="Back to partners"
      >
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </app-partner-details-view>
  } @else if (partner() === null) {
    <section class="not-found card">
      <h1>Partner not found</h1>
      <p>This partner may no longer be available.</p>
      <a class="pill-button" routerLink="/partners">Back to partners</a>
    </section>
  } @else {
    <div class="detail-hero detail-hero--partners loading-hero">
      <a class="back-button" appBackLink routerLink="/partners" queryParamsHandling="preserve" aria-label="Back to partners">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </a>
    </div>
    <app-skeleton variant="partner-detail" />
  }
</main>
