<main class="details-page">
  <a
    class="back"
    routerLink="/partners"
    queryParamsHandling="preserve"
    aria-label="Back to partners"
  >
    <span class="back-icon" aria-hidden="true"></span>
    <span class="back-label">Partners</span>
  </a>

  @if (partner(); as loaded) {
    <app-partner-details-view [partner]="detailsViewModel(loaded)" />
  } @else if (partner() === null) {
    <section class="not-found">
      <span aria-hidden="true">?</span>
      <h1>Partner not found</h1>
      <p>This partner may no longer be available.</p>
      <a routerLink="/partners">Return to partners</a>
    </section>
  } @else {
    <app-loading-spinner />
  }
</main>
