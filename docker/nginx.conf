server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and health checks to the backend container so the
    # production build can call the API same-origin (no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }

    location /swagger {
        proxy_pass http://backend:8080/swagger;
        proxy_set_header Host $host;
    }

    # SPA fallback: let the Angular router handle everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
