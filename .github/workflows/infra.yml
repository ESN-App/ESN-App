name: Infra

# OpenTofu for the Hetzner PoC and the repo's `poc` environment (see infra/tofu/README.md).
# Environment `infra` MUST be created by hand BEFORE the first run (required reviewer, deployment
# branches = `hetzner` only); GitHub would otherwise auto-create it without protection.
#   infra secrets: HCLOUD_TOKEN (Read & Write), TOFU_STATE_PASSPHRASE, TOFU_GITHUB_TOKEN
#   infra vars:    OWNER_SSH_KEY_NAME, SEED_ADMIN_EMAIL, EMAIL_FROM_ADDRESS, POC_REVIEWER_USER_IDS (JSON list, required),
#                  optional ADMIN_SSH_CIDRS (JSON list), STATE_REPO (default: this repo), STATE_BRANCH (default: infra-state),
#                  and secret STATE_TOKEN (only when STATE_REPO is another repo; needs contents: write there)
# Encrypted state is committed to STATE_BRANCH of STATE_REPO (checked out into .state/).
on:
  push:
    branches: [hetzner]
    paths:
      - 'infra/tofu/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: this is also the lock for the state branch.
concurrency:
  group: infra-state
  cancel-in-progress: false

jobs:
  # No secrets: runs for every push, before the approval gate.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: fmt and validate
        working-directory: infra/tofu
        env:
          TF_ENCRYPTION: |
            key_provider "pbkdf2" "main" {
              passphrase = "dummy-passphrase-for-validate-only"
            }
        run: |
          tofu init -backend=false -input=false
          tofu fmt -check -recursive
          tofu validate

  plan-apply:
    needs: check
    if: github.ref == 'refs/heads/hetzner'
    runs-on: ubuntu-latest
    environment: infra # manual approval gate; holds all bootstrap secrets
    permissions:
      contents: write
    env:
      STATE_REPO: ${{ vars.STATE_REPO || github.repository }}
      STATE_BRANCH: ${{ vars.STATE_BRANCH || 'infra-state' }}
      TF_VAR_owner_ssh_key_name: ${{ vars.OWNER_SSH_KEY_NAME }}
      TF_VAR_admin_ssh_cidrs: ${{ vars.ADMIN_SSH_CIDRS || '[]' }}
      TF_VAR_poc_reviewer_user_ids: ${{ vars.POC_REVIEWER_USER_IDS }}
      TF_VAR_seed_admin_email: ${{ vars.SEED_ADMIN_EMAIL }}
      TF_VAR_email_from_address: ${{ vars.EMAIL_FROM_ADDRESS }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch state branch (or start an orphan one)
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN || github.token }}
        run: |
          url="https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git"
          if git ls-remote --exit-code --heads "$url" "$STATE_BRANCH" >/dev/null; then
            git clone --quiet --branch "$STATE_BRANCH" --single-branch "$url" .state
          else
            git init -q -b "$STATE_BRANCH" .state
            git -C .state remote add origin "$url"
            printf '# infra-state\n\nEncrypted OpenTofu state (managed by .github/workflows/infra.yml). Do not edit.\n' > .state/README.md
          fi
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: Init, plan, apply
        id: tofu
        working-directory: infra/tofu
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TOFU_GITHUB_TOKEN }}
          TF_ENCRYPTION: |
            key_provider "pbkdf2" "main" {
              passphrase = "${{ secrets.TOFU_STATE_PASSPHRASE }}"
            }
        run: |
          tofu init -input=false
          tofu plan -input=false -lock=false -out="$RUNNER_TEMP/poc.tfplan"
          tofu apply -input=false -lock=false "$RUNNER_TEMP/poc.tfplan"
          {
            echo '### Outputs'
            echo '```'
            tofu output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Also runs after a failed apply so partial state is never lost.
      - name: Commit encrypted state
        if: always() && steps.tofu.outcome != 'skipped'
        run: |
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m 'chore(infra): update state'
          git push origin HEAD:"$STATE_BRANCH"
