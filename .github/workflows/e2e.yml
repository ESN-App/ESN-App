name: E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Compose defaults already match .env.example (dev admin, JWT key); .env is not copied
      # because the example file carries SMTP settings that CI must not use.
      - name: Start the stack (postgres, API with migrations + seed, nginx frontend)
        run: docker compose up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          # /health goes frontend -> backend, so this also proves the proxy works.
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4200/health && curl -fsS -o /dev/null http://localhost:4200/ && exit 0
            sleep 3
          done
          docker compose logs backend
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: docker compose logs backend
