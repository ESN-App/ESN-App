name: Backend CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/EsnApp.sln

      - name: Build
        run: dotnet build backend/EsnApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/EsnApp.sln --no-build --configuration Release
