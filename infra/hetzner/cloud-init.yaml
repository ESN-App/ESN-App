#cloud-config
# PoC server baseline (ADR-006). Replace the SSH key placeholder before creating the server.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REPLACE_WITH_DEPLOY_PUBLIC_KEY deploy@esn

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local", "log-opts": {"max-size": "10m", "max-file": "3"}}
  - path: /etc/sysctl.d/99-swappiness.conf
    content: |
      vm.swappiness=10

runcmd:
  # The docker group does not exist when the users module runs; add deploy after install below.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy
  - systemctl restart docker
  # 2 GB swap file
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system
  # Security updates
  - DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive unattended-upgrades
  - mkdir -p /opt/esn
  - chown deploy:deploy /opt/esn
  - systemctl restart ssh
